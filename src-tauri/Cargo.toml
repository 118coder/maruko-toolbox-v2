[package]
name = "maruko-v2"
version = "2.0.0"
description = "小丸工具箱V2现代版"
authors = ["Maruko V2 Project"]
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["crates/maruko-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
maruko-core = { path = "crates/maruko-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"
