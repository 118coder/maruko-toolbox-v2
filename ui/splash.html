<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap {
    height: 100%;
    background: linear-gradient(135deg, #e9488a, #7c5cff);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; user-select: none;
  }
  img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  h1 { font-size: 21px; margin: 16px 0 4px; letter-spacing: 1px; }
  p { margin: 0; font-size: 12px; opacity: .85; }
  .bar { width: 160px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.3); margin-top: 18px; overflow: hidden; }
  .bar > div { width: 40%; height: 100%; background: #fff; border-radius: 3px; animation: load 1.1s ease-in-out infinite; }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
</style>
</head>
<body>
<div class="wrap">
  <img src="splash_icon.png" alt="" />
  <h1>小丸工具箱V2现代版</h1>
  <p>GPU 加速 · 现代界面 · 兼容原版工具链</p>
  <div class="bar"><div></div></div>
</div>
</body>
</html>
